    <div id="peachBanner"
      class="bg-[#fdece6] text-[#df6426] py-2 px-3 text-center text-sm sm:text-base font-black border-b border-[#f9d8cc] shrink-0 tracking-wide">
      نظام إدارة وتشغيل وصيانة مطار حائل الدولي
    </div>

    <!-- 4. Dynamic Sub-Screen Header (Replaces Brand Header when inside any sub-screen) -->
    <header id="subHeaderBar"
      class="hidden bg-white border-b border-[#ece6e1] px-3.5 py-2.5 flex items-center justify-between gap-2.5 shrink-0 shadow-2xs">
    </header>

    <!-- 4-B. Interactive Breadcrumbs Path Bar (شريط المسار للتنقل بين التفريعات والنوافذ) -->
    <nav id="breadcrumbBar" aria-label="مسار التنقل Breadcrumbs"
      class="hidden px-3.5 py-1.5 border-b border-[#ece6e1] flex items-center gap-1 overflow-x-auto no-scrollbar shrink-0 text-xs">
    </nav>

    <!-- 5. Scrollable Main Content Viewport -->
    <main class="flex-1 overflow-y-auto custom-scroll pb-20" id="mainScrollArea">
      <div id="viewContainer"></div>
    </main>

    <!-- 6. Bottom Navigation Bar -->
    <nav id="bottomNav" class="bg-white border-t border-[#ece6e1] px-2 py-1.5 grid grid-cols-4 gap-1 shrink-0 z-20">
      <button type="button" data-tab="home" onclick="goHome()"
        class="nav-btn flex flex-col items-center justify-center py-1 px-1 rounded-xl text-[11px] font-bold transition text-[#db6b49]">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5.5v-6h-5v6H4a1 1 0 01-1-1v-9.5z" />
        </svg>
        <span>الرئيسية</span>
      </button>

      <button type="button" data-tab="tours_hub" onclick="switchTab('tours_hub')"
        class="nav-btn flex flex-col items-center justify-center py-1 px-1 rounded-xl text-[11px] font-medium transition text-[#64748b]">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        <span>جولات التفتيش</span>
      </button>

      <button type="button" data-tab="tanks_dash" onclick="switchTab('tanks_dash')"
        class="nav-btn flex flex-col items-center justify-center py-1 px-1 rounded-xl text-[11px] font-medium transition text-[#64748b]">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
        </svg>
        <span>الخزانات</span>
      </button>

      <button type="button" data-tab="more" onclick="switchTab('more')"
        class="nav-btn flex flex-col items-center justify-center py-1 px-1 rounded-xl text-[11px] font-medium transition text-[#64748b]">
        <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="1.5" />
          <circle cx="6" cy="12" r="1.5" />
          <circle cx="18" cy="12" r="1.5" />
        </svg>
        <span>المزيد</span>
      </button>
    </nav>

    <!-- 6-B. Global Floating Action Button (زر الإضافة العائم الدائري FAB في الصفحات التي تدعم الإضافة الحقيقية) -->
    <button type="button" id="globalFabBtn" onclick="handleGlobalFabClick()"
      class="hidden fab-btn absolute bottom-[72px] left-4 z-30 w-14 h-14 rounded-full bg-[#db6b49] hover:bg-[#c55a3a] active:scale-95 text-white shadow-xl shadow-[#db6b49]/40 flex items-center justify-center transition-all duration-200 group"
      title="إضافة جديد" aria-label="إضافة جديد">
      <svg class="w-7 h-7 transition-transform group-hover:rotate-90 duration-300" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
    </button>

    <!-- 7. Interactive Bottom Sheet (نافذة منبثقة للإضافة والتفرعات والنماذج الذكية) -->
    <div id="bottomSheetBackdrop"
      class="fixed inset-0 z-40 hidden bg-black/55 backdrop-blur-[1.5px] flex items-end justify-center">
      <div id="bottomSheetPanel"
        class="sheet-up bg-[#faf7f5] w-full max-w-[412px] rounded-t-3xl shadow-2xl border-t border-[#e5dfd9] max-h-[89vh] flex flex-col overflow-hidden">
        <div class="pt-2.5 pb-1 flex justify-center shrink-0" onclick="closeBottomSheet()">
          <span class="w-10 h-1.5 rounded-full bg-[#d6cec7] cursor-pointer"></span>
        </div>
        <div class="px-4 py-2.5 border-b border-[#ece6e1] shrink-0 space-y-1.5">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span id="sheetBadgeIcon"
                class="w-7 h-7 rounded-xl bg-[#fdece6] text-[#db6b49] flex items-center justify-center text-xs font-extrabold">💡</span>
              <h3 id="sheetTitle" class="font-extrabold text-sm text-[#111827]">معلومات الوحدة</h3>
            </div>
            <button type="button" onclick="closeBottomSheet()"
              class="w-7 h-7 rounded-full bg-[#f3ece6] hover:bg-[#e5dfd9] text-[#374151] flex items-center justify-center text-xs font-bold">✕</button>
          </div>
          <div id="sheetBreadcrumb"
            class="flex items-center gap-1 overflow-x-auto no-scrollbar text-[11px] text-[#6b7280] pt-0.5"></div>
        </div>
        <div id="sheetBody" class="p-4 overflow-y-auto custom-scroll text-xs space-y-3"></div>
      </div>
    </div>

  </div>

  <!-- Toast Notification -->
  <div id="toastBox"
    class="fixed bottom-16 left-1/2 -translate-x-1/2 z-50 hidden bg-[#1f2937] text-white px-4 py-2.5 rounded-xl shadow-xl border border-slate-700 text-xs flex items-center gap-2">
    <span id="toastIcon">✅</span>
    <span id="toastMsg">تم الحفظ بنجاح</span>
